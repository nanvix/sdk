name: Update Pipeline

#==================================================================================================
# Trigger Conditions
#==================================================================================================

on:
  # Nightly check for newer pinned inputs (08:00 UTC == 00:00 PST), matching the
  # llvm fork's nanvix-update schedule.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# Serialize update runs so concurrent bumps do not race on the PR branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

#==================================================================================================
# Environment Variables
#==================================================================================================

env:
  # GitHub usernames (comma-separated) assigned to the bump PR. The PR is
  # authored by the DISPATCH_TOKEN owner, and GitHub forbids requesting a review
  # from a PR's own author ("Review cannot be requested from pull request
  # author"), so the maintainer is assigned rather than requested as a reviewer.
  PR_ASSIGNEES: ppenna

  # Safety cap (in seconds) for how long to wait on the dev sccache-warming
  # build before opening the PR anyway. Set generously above a cold LLVM build
  # (default: 2h). Bump this if warming builds start exceeding it.
  WARMING_BUILD_TIMEOUT_SECONDS: 7200

#==================================================================================================
# Jobs
#==================================================================================================

jobs:
  update:
    name: Bump pinned toolchain inputs
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write
      # Read Actions runs so the wait-for-warming-build step below can poll the
      # dev CI run status via the gh CLI before opening the PR.
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + initialized submodule so z.py can advance the
          # llvm gitlink and create-pull-request can commit the bump.
          fetch-depth: 0
          submodules: recursive

      # z.py resolves the llvm branch tip (the single coupling anchor),
      # reads the Nanvix libc release that tip's `z` script targets, and pins
      # BOTH libc.lock and the submodule gitlink to that one commit. Deriving
      # the libc pin from the fork tip keeps the two SDK halves from skewing.
      # changed / tag / updated_vars are published to $GITHUB_OUTPUT so the PR
      # step below only runs when something actually moved. GH_TOKEN raises the
      # GitHub API rate limit and authorizes the submodule fetch.
      - name: Bump pinned inputs
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./z.py update --no-dry-run --provider c-clang

      # Guard against the LLVM sccache producer/consumer race. The bump PR we are
      # about to open rebuilds the whole toolchain in CI, and that PR build can
      # only restore the shared LLVM sccache once the dev-push "warming" build
      # (.github/workflows/build.yml) for the current dev HEAD has finished and
      # saved it in the default-branch cache scope. GitHub scopes caches by ref,
      # so a PR sees only its own refs/pull/N/merge scope plus the dev scope; if
      # we open the PR while that warming build is still compiling LLVM, the PR
      # CI starts, finds an empty dev scope ("Cache not found"), and rebuilds the
      # toolchain from scratch. Block here until the warming run for github.sha
      # reaches a terminal state so the dev-scope sccache exists first.
      - name: Wait for the dev sccache-warming build
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # (databaseId, status, conclusion) of the newest dev-push CI run whose
          # head commit is the dev HEAD this bump is based on; empty if none.
          warming_run() {
            gh run list --workflow build.yml --branch dev --event push \
              --limit 20 --json databaseId,headSha,status,conclusion \
              --jq "map(select(.headSha == \"${HEAD_SHA}\")) | first
                    | select(. != null)
                    | [.databaseId, .status, .conclusion] | @tsv"
          }

          echo "Waiting for the dev sccache-warming build of ${HEAD_SHA}..."
          deadline=$(( $(date +%s) + WARMING_BUILD_TIMEOUT_SECONDS ))   # safety cap (> a cold build)
          while :; do
            row="$(warming_run || true)"
            if [ -z "${row}" ]; then
              echo "No dev-push CI run found for ${HEAD_SHA}; nothing to wait for."
              break
            fi

            id="$(printf '%s' "${row}" | cut -f1)"
            status="$(printf '%s' "${row}" | cut -f2)"
            conclusion="$(printf '%s' "${row}" | cut -f3)"
            echo "  warming run ${id}: status=${status} conclusion=${conclusion}"

            if [ "${status}" = "completed" ]; then
              echo "Warming build finished (${conclusion}); dev-scope sccache is saved."
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::warning::Timed out waiting for warming run ${id}; opening PR anyway."
              break
            fi
            sleep 30
          done

      # Create the PR with a PAT (DISPATCH_TOKEN), not the default GITHUB_TOKEN:
      # GitHub suppresses workflow triggers for events raised by GITHUB_TOKEN to
      # prevent recursive runs, so a PR opened with it never fires the CI
      # Pipeline -- the `build` check stays `action_required` and the PR is
      # un-mergeable (UNSTABLE). A PAT makes the created PR trigger CI normally.
      # DISPATCH_TOKEN is an existing org secret already provisioned for
      # triggering workflows, so no new secret is needed. See
      # peter-evans/create-pull-request docs.
      - name: Open bump pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          commit-message: "chore(sdk): bump toolchain inputs (${{ steps.update.outputs.updated_vars }})"
          branch: "update/toolchain-${{ steps.update.outputs.tag }}"
          title: "Bump toolchain inputs to ${{ steps.update.outputs.tag }}"
          body: |
            Automated bump of the pinned SDK toolchain inputs.

            - libc release (`nanvix/nanvix`): **${{ steps.update.outputs.tag }}**
            - Updated pins: `${{ steps.update.outputs.updated_vars }}`

            Both halves are pinned from the same `providers/c-clang/llvm`
            branch tip: libc.lock is set to the release that tip's `z` script
            targets (`NANVIX_RELEASE_TAG`), so the LLVM and libc pins stay
            coupled. Generated automatically by the update workflow
            (`.github/workflows/update.yml`).
          base: dev
          labels: automated,update
          assignees: ${{ env.PR_ASSIGNEES }}
