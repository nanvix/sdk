name: CI Pipeline

#==================================================================================================
# Trigger Conditions
#==================================================================================================

on:
  # Pull requests validate every change before it lands on dev.
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'
  # A push to dev (a merged PR) rebuilds and -- crucially -- saves the LLVM
  # sccache in the default-branch cache scope. GitHub quarantines pull_request
  # caches to their own merge ref, so neither another PR nor the tag-triggered
  # release can restore a cache a PR saved. Only a cache written by a trusted
  # event on the default branch is visible to both, so this dev build is what
  # keeps the shared sccache warm for later PRs and releases; the sccache in turn
  # keeps each rebuild largely incremental.
  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

#==================================================================================================
# Jobs
#==================================================================================================

jobs:
  build:
    if: |
      github.event_name != 'pull_request' ||
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Reclaim runner disk space, stand up the docker-container Buildx builder
      # (uncapped BuildKit logs), and restore + inject the LLVM sccache into its
      # cache mount -- shared with the release pipeline via the composite action
      # in .github/actions/setup-build-env so both jobs prep the runner alike.
      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build-env
        with:
          sccache-key: ${{ runner.os }}-sccache-c-clang-${{ github.sha }}
          sccache-restore-keys: |
            ${{ runner.os }}-sccache-c-clang-

      # Every image is built from source from the pinned submodule, so the image
      # verified here is identical to what a release publishes (see
      # doc/versioning.md).
      - name: Build c-clang SDK image
        run: |
          ./z.py build-image --no-dry-run \
            --provider c-clang \
            --builder ${{ steps.setup.outputs.builder }} \
            --tag ci-${{ github.sha }}

      - name: Verify (canary build inside the image)
        run: |
          ./z.py verify --no-dry-run \
            --provider c-clang \
            --image ghcr.io/nanvix/nanvix-sdk-c-clang:ci-${{ github.sha }}
