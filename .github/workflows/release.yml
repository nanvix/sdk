name: Release Pipeline

#==================================================================================================
# Trigger Conditions
#==================================================================================================

on:
  # Releases are cut from tags only. The tag pipeline
  # (.github/workflows/tag.yml) auto-creates the v<nanvix>-sdk.<N> tag on pushes
  # to dev, and that tag push is what triggers this build + publish. The build
  # restores the LLVM sccache the CI pipeline warms on the dev branch (see
  # .github/workflows/build.yml): a cache written by a trusted push to the
  # default branch is the only one a tag run is allowed to restore, so a release
  # reuses that toolchain instead of recompiling it from scratch.
  push:
    tags:
      - 'v*'

# Serialize releases.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

#==================================================================================================
# Permissions
#==================================================================================================

permissions:
  contents: write
  packages: write

#==================================================================================================
# Jobs
#==================================================================================================

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Reclaim runner disk space, stand up the docker-container Buildx builder
      # (uncapped BuildKit logs), and restore + inject the LLVM sccache into its
      # cache mount -- shared with the CI pipeline via the composite action in
      # .github/actions/setup-build-env so a release does not recompile the whole
      # toolchain from scratch.
      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build-env
        with:
          sccache-key: ${{ runner.os }}-sccache-c-clang-release-${{ github.sha }}
          sccache-restore-keys: |
            ${{ runner.os }}-sccache-c-clang-release-
            ${{ runner.os }}-sccache-c-clang-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version is the pushed tag (v<nanvix>-sdk.<N>), auto-created by the
      # tag pipeline (.github/workflows/tag.yml). Release builds LLVM from the
      # pinned submodule (the only build path), then pushes the provider image
      # plus the umbrella ghcr.io/nanvix/nanvix-sdk:<version> alias, each
      # carrying the nanvix-sdk.json manifest + OCI labels.
      - name: Build and push c-clang SDK image
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ./z.py release --no-dry-run --version "${VERSION}" \
            --provider c-clang --push \
            --builder ${{ steps.setup.outputs.builder }}

      - name: Verify pushed image
        run: |
          ./z.py verify --no-dry-run --provider c-clang \
            --image "${{ steps.build.outputs.image_ref }}"

      # The public contract is derived only after the pushed image passes its
      # non-root canaries. Its helper pulls, inspects, and runs name@digest,
      # then requires every embedded manifest field to match its OCI label.
      - name: Generate release contract
        run: |
          ./z.py generate-contract --no-dry-run --provider c-clang \
            --image-name "${{ steps.build.outputs.image_name }}" \
            --digest "${{ steps.build.outputs.image_digest }}" \
            --output sdk-release.json

      - name: Verify release contract
        run: |
          ./z.py verify-contract --no-dry-run \
            --contract sdk-release.json

      # A rerun edits the release for this existing tag and replaces the asset,
      # rather than creating duplicate release state.
      - name: Create or refresh GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Nanvix SDK ${GITHUB_REF_NAME}"
          NOTES="Verified Nanvix SDK release. The attached sdk-release.json is the authoritative immutable contract."
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${TITLE}" --notes "${NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --draft --title "${TITLE}" --notes "${NOTES}"
          fi
          gh release upload "${GITHUB_REF_NAME}" sdk-release.json --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          RELEASE_URL="$(gh release view "${GITHUB_REF_NAME}" --json url --jq .url)"
          echo "release_url=${RELEASE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Detect optional dispatch token
        id: dispatch-token
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -n "${DISPATCH_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      # repository_dispatch is optional. The stable digest-based idempotency key
      # lets nanvix/workflows safely collapse deliveries from workflow reruns.
      - name: Dispatch verified SDK release
        if: steps.dispatch-token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          RELEASE_URL: ${{ steps.github-release.outputs.release_url }}
        run: |
          set -o pipefail
          ./z.py dispatch-payload --contract sdk-release.json \
            --release-url "${RELEASE_URL}" \
            | gh api --method POST repos/nanvix/workflows/dispatches --input -
